<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD-Blocker 控制台</title>
    
    <!-- 引入外部的 CSS 樣式表 -->
    <link rel="stylesheet" href="popup.css">
    
    <!-- 引入外部的 JS 腳本 -->
    <script src="popup.js" defer></script> 
</head>
<body>
    <h1>🛡️ AD-Blocker</h1>
    <p class="subtitle">老娘要把廣告全擋掉！</p>

    <!-- 開關元件 -->
    <label class="switch">
        <input type="checkbox" id="toggle-btn" checked>
        <span class="slider"></span>
    </label>

    <div id="status-text">防護運作中</div>
</body>
</html>
